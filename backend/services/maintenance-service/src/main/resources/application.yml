spring:
  application:
    name: maintenance-service
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/facility_maintenance?serverTimezone=UTC}
    username: ${SPRING_DATASOURCE_USERNAME:maintenance_local}
    password: ${SPRING_DATASOURCE_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: ${JWT_JWK_SET_URI:http://localhost:8082/oauth2/jwks}
  data:
    web:
      pageable:
        max-page-size: 100
        default-page-size: 20
  jackson:
    serialization:
      write-dates-as-timestamps: false
app:
  jwt:
    issuer: ${IDENTITY_JWT_ISSUER:http://localhost:8082}
    audience: ${IDENTITY_JWT_AUDIENCE:facility-api}
  property-service:
    base-url: ${PROPERTY_SERVICE_URL:http://localhost:8083}
    connect-timeout: 2s
    read-timeout: 3s
    max-attempts: 2
  notification-service:
    base-url: ${NOTIFICATION_SERVICE_URL:http://localhost:8086}
    api-key: ${INTERNAL_API_KEY:}
  outbox:
    enabled: ${OUTBOX_ENABLED:true}
    interval: ${OUTBOX_INTERVAL:5s}
    batch-size: ${OUTBOX_BATCH_SIZE:50}
    max-attempts: ${OUTBOX_MAX_ATTEMPTS:5}
logging:
  pattern:
    level: "%5p [%X{correlationId:-}]"
server:
  port: ${SERVER_PORT:8084}
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
springdoc:
  swagger-ui:
    path: /swagger-ui.html
