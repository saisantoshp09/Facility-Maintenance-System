spring:
  application:
    name: api-gateway
  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: ${JWT_JWK_SET_URI:http://localhost:8082/oauth2/jwks}
  cloud:
    gateway:
      server:
        webflux:
          globalcors:
            cors-configurations:
              '[/**]':
                allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:4200}
                allowed-methods: GET,POST,PUT,PATCH,DELETE,OPTIONS
                allowed-headers: Authorization,Content-Type,X-Correlation-ID
                allow-credentials: false
                max-age: 3600
          default-filters:
            - name: RequestSize
              args:
                maxSize: 2MB
          routes:
            - id: identity-service
              uri: ${IDENTITY_SERVICE_URL:http://localhost:8082}
              predicates:
                - Path=/api/v1/auth/**,/api/v1/users/**
            - id: property-service
              uri: ${PROPERTY_SERVICE_URL:http://localhost:8083}
              predicates:
                - Path=/api/v1/properties/**,/api/v1/units/**
            - id: maintenance-service
              uri: ${MAINTENANCE_SERVICE_URL:http://localhost:8084}
              predicates:
                - Path=/api/v1/maintenance-requests/**,/api/v1/work-orders/**
            - id: asset-service
              uri: ${ASSET_SERVICE_URL:http://localhost:8085}
              predicates:
                - Path=/api/v1/assets/**,/api/v1/maintenance-schedules/**
            - id: notification-service
              uri: ${NOTIFICATION_SERVICE_URL:http://localhost:8086}
              predicates:
                - Path=/api/v1/notifications/**
server:
  port: ${SERVER_PORT:8081}
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
