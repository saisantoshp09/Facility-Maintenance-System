services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Copy .env.example to .env and set local values}
      IDENTITY_DB_USER: ${IDENTITY_DB_USER:?Set IDENTITY_DB_USER in .env}
      IDENTITY_DB_PASSWORD: ${IDENTITY_DB_PASSWORD:?Set IDENTITY_DB_PASSWORD in .env}
      PROPERTY_DB_USER: ${PROPERTY_DB_USER:?Set PROPERTY_DB_USER in .env}
      PROPERTY_DB_PASSWORD: ${PROPERTY_DB_PASSWORD:?Set PROPERTY_DB_PASSWORD in .env}
      MAINTENANCE_DB_USER: ${MAINTENANCE_DB_USER:?Set MAINTENANCE_DB_USER in .env}
      MAINTENANCE_DB_PASSWORD: ${MAINTENANCE_DB_PASSWORD:?Set MAINTENANCE_DB_PASSWORD in .env}
      ASSET_DB_USER: ${ASSET_DB_USER:?Set ASSET_DB_USER in .env}
      ASSET_DB_PASSWORD: ${ASSET_DB_PASSWORD:?Set ASSET_DB_PASSWORD in .env}
      NOTIFICATION_DB_USER: ${NOTIFICATION_DB_USER:?Set NOTIFICATION_DB_USER in .env}
      NOTIFICATION_DB_PASSWORD: ${NOTIFICATION_DB_PASSWORD:?Set NOTIFICATION_DB_PASSWORD in .env}
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./docker/mysql/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p\"$$MYSQL_ROOT_PASSWORD\" --silent"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s

  identity-service:
    build:
      context: .
      dockerfile: backend/services/identity-service/Dockerfile
    environment:
      SPRING_DATASOURCE_URL: ${IDENTITY_DB_URL}
      SPRING_DATASOURCE_USERNAME: ${IDENTITY_DB_USER}
      SPRING_DATASOURCE_PASSWORD: ${IDENTITY_DB_PASSWORD}
      JWT_JWK_SET_URI: http://identity-service:8082/oauth2/jwks
      SERVER_PORT: 8082
    depends_on:
      mysql:
        condition: service_healthy
    ports:
      - "8082:8082"

  property-service:
    build:
      context: .
      dockerfile: backend/services/property-service/Dockerfile
    environment:
      SPRING_DATASOURCE_URL: ${PROPERTY_DB_URL}
      SPRING_DATASOURCE_USERNAME: ${PROPERTY_DB_USER}
      SPRING_DATASOURCE_PASSWORD: ${PROPERTY_DB_PASSWORD}
      JWT_JWK_SET_URI: http://identity-service:8082/oauth2/jwks
      SERVER_PORT: 8083
    depends_on:
      mysql:
        condition: service_healthy
    ports:
      - "8083:8083"

  maintenance-service:
    build:
      context: .
      dockerfile: backend/services/maintenance-service/Dockerfile
    environment:
      SPRING_DATASOURCE_URL: ${MAINTENANCE_DB_URL}
      SPRING_DATASOURCE_USERNAME: ${MAINTENANCE_DB_USER}
      SPRING_DATASOURCE_PASSWORD: ${MAINTENANCE_DB_PASSWORD}
      JWT_JWK_SET_URI: http://identity-service:8082/oauth2/jwks
      SERVER_PORT: 8084
    depends_on:
      mysql:
        condition: service_healthy
    ports:
      - "8084:8084"

  asset-service:
    build:
      context: .
      dockerfile: backend/services/asset-service/Dockerfile
    environment:
      SPRING_DATASOURCE_URL: ${ASSET_DB_URL}
      SPRING_DATASOURCE_USERNAME: ${ASSET_DB_USER}
      SPRING_DATASOURCE_PASSWORD: ${ASSET_DB_PASSWORD}
      JWT_JWK_SET_URI: http://identity-service:8082/oauth2/jwks
      SERVER_PORT: 8085
    depends_on:
      mysql:
        condition: service_healthy
    ports:
      - "8085:8085"

  notification-service:
    build:
      context: .
      dockerfile: backend/services/notification-service/Dockerfile
    environment:
      SPRING_DATASOURCE_URL: ${NOTIFICATION_DB_URL}
      SPRING_DATASOURCE_USERNAME: ${NOTIFICATION_DB_USER}
      SPRING_DATASOURCE_PASSWORD: ${NOTIFICATION_DB_PASSWORD}
      JWT_JWK_SET_URI: http://identity-service:8082/oauth2/jwks
      SERVER_PORT: 8086
    depends_on:
      mysql:
        condition: service_healthy
    ports:
      - "8086:8086"

  api-gateway:
    build:
      context: .
      dockerfile: backend/services/api-gateway/Dockerfile
    environment:
      SERVER_PORT: 8081
      IDENTITY_SERVICE_URL: http://identity-service:8082
      PROPERTY_SERVICE_URL: http://property-service:8083
      MAINTENANCE_SERVICE_URL: http://maintenance-service:8084
      ASSET_SERVICE_URL: http://asset-service:8085
      NOTIFICATION_SERVICE_URL: http://notification-service:8086
      JWT_JWK_SET_URI: http://identity-service:8082/oauth2/jwks
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:4200}
    depends_on:
      - identity-service
      - property-service
      - maintenance-service
      - asset-service
      - notification-service
    ports:
      - "8081:8081"

volumes:
  mysql_data:
